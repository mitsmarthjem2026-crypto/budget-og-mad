const BASIS=['salt','peber','vand'];
const norm=s=>String(s||'').toLowerCase().replace(/[^a-zæøå ]/g,' ').replace(/\s+/g,' ').trim();
const STOP=['hakket','hakkede','kogte','kogt','frisk','friske','stk','og','af','til','rester','gerne'];
const tok=s=>norm(s).split(' ').filter(w=>w.length>1&&!STOP.includes(w));
function iLager(navn){const n=norm(navn);if(BASIS.includes(n))return{basis:true};const w=tok(navn);if(!w.length)return null;return D.lager.find(l=>{const a=tok(l.navn);return a.length&&(a.every(x=>w.includes(x))||w.every(x=>a.includes(x)))})}
const ENH={g:['m',1],kg:['m',1000],ml:['v',1],cl:['v',10],dl:['v',100],l:['v',1000]};
function base(i){const e=ENH[i.enhed];return e?{k:e[0],v:i.maengde*e[1]}:{k:i.enhed,v:i.maengde}}
function nokPaaLager(l,i){if(l.basis||l.maengde==null||i.maengde==null)return true;const a=base(l),b=base(i);return a.k===b.k&&a.v>=b.v}
function match(o){const ing=o.ing.filter(i=>!BASIS.includes(norm(i.navn)));const har=ing.filter(i=>iLager(i.navn)).length;return{har,af:ing.length,pct:ing.length?har/ing.length:0}}

D.budget.ind=D.budget.ind||[];D.budget.faste=D.budget.faste||[];D.budget.maal=D.budget.maal||[];D.priser=D.priser||{};D.stdSlettet=D.stdSlettet||[];
STD_OPSKRIFTER.forEach(s=>{if(!D.opskrifter.some(o=>o.id===s.id)&&!D.stdSlettet.includes(s.id))D.opskrifter.push({...s,ing:s.ing.map(parseIng),trin:[...s.trin],tags:[...s.tags]})});
let budgetMd=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
let side='forside';if(['#forside','#opskrifter','#madplan','#indkob','#lager','#budget'].includes(location.hash))side=location.hash.slice(1);
let ugeStart=mandag(new Date());
const save=()=>localStorage.setItem(KEY,JSON.stringify(D));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kr=n=>{n=Math.round(n*100)/100;return n.toLocaleString('da-DK',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+' kr'};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function mandag(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
const DAGE=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];

let undoFn=null,tT;
function toast(msg,undo){const t=document.getElementById('toast');document.getElementById('tmsg').textContent=msg;undoFn=undo;document.getElementById('tundo').style.display=undo?'':'none';t.style.display='flex';clearTimeout(tT);tT=setTimeout(()=>t.style.display='none',6000)}
document.getElementById('tundo').onclick=()=>{if(undoFn){undoFn();save();vis()}document.getElementById('toast').style.display='none'};
function snap(){return JSON.stringify(D)}
function fortrydTil(s){return()=>{D=JSON.parse(s)}}

// "200 g mel" -> {maengde:200, enhed:'g', navn:'mel'}
function parseIng(linje){
  const m=linje.trim().match(/^([\d]+(?:[.,]\d+)?)\s*(g|kg|ml|dl|cl|l|stk|spsk|tsk|knsp|fed|dåse|dåser|pakke|pk|bundt)?\.?\s+(.+)$/i);
  if(m)return{maengde:parseFloat(m[1].replace(',','.')),enhed:(m[2]||'').toLowerCase(),navn:m[3].trim()};
  return{maengde:null,enhed:'',navn:linje.trim()};
}
const ingTekst=i=>(i.maengde!=null?(String(i.maengde).replace('.',',')+' '):'')+(i.enhed?i.enhed+' ':'')+i.navn;
const sammeNavn=(a,b)=>a.trim().toLowerCase()===b.trim().toLowerCase();

function tilIndkob(ings){
  let n=0;
  ings.forEach(i=>{
    const paaLager=iLager(i.navn);
    if(paaLager&&nokPaaLager(paaLager,i))return;
    const fin=D.indkob.find(x=>!x.kobt&&sammeNavn(x.navn,i.navn)&&x.enhed===i.enhed);
    if(fin){if(fin.maengde!=null&&i.maengde!=null)fin.maengde+=i.maengde}
    else D.indkob.push({id:id(),navn:i.navn,maengde:i.maengde,enhed:i.enhed,pris:D.priser[norm(i.navn)]??null,kobt:false});
    n++;
  });
  return n;
}

const SIDER={
opskrifter(){
  const q=(window._q||'').toLowerCase(),fl=window._fl||'alle';
  const F={alle:'Alle',dansk:'🇩🇰 Dansk',vegetar:'🥕 Vegetar',hurtig:'⏱️ Hurtig',kan:'🥫 Kan laves nu',mine:'⭐ Mine'};
  let liste=D.opskrifter.filter(o=>!q||o.navn.toLowerCase().includes(q)||o.ing.some(i=>i.navn.toLowerCase().includes(q)));
  if(fl==='kan')liste=liste.filter(o=>match(o).pct>=.6).sort((a,b)=>match(b).pct-match(a).pct);
  else if(fl==='mine')liste=liste.filter(o=>!String(o.id).startsWith('std-'));
  else if(fl==='hurtig')liste=liste.filter(o=>(o.tags||[]).includes('hurtig')||(o.tid&&o.tid<=30));
  else if(fl!=='alle')liste=liste.filter(o=>(o.tags||[]).includes(fl));
  return `<h2>Opskrifter</h2>
  <div class="row" style="margin-bottom:12px"><input class="grow" id="soeg" placeholder="Søg i opskrifter eller ingredienser" value="${esc(window._q||'')}"><button class="b" onclick="redigerOpskrift()">+ Ny opskrift</button></div>
  <div class="chips">${Object.entries(F).map(([k,v])=>`<button class="chip ${fl===k?'on':''}" onclick="window._fl='${k}';vis()">${v}</button>`).join('')}</div>
  ${liste.length?`<div class="grid">${liste.map(o=>{const mt=match(o);return `<div class="card rc rkort" onclick="visOpskrift('${o.id}')"><div class="rfoto ${o.foto?'':'tom'}" ${o.foto?`style="background-image:url(${o.foto})"`:''}>${o.foto?'':'🍽️'}${D.lager.length&&mt.har?`<span class="harbadge">✅ ${mt.har}/${mt.af}</span>`:''}</div><div class="rinfo"><h3>${esc(o.navn)}</h3><div class="muted">${o.tid?'⏱️ '+o.tid+' min · ':''}${o.portioner?o.portioner+' pers. · ':''}${o.ing.length} ingredienser</div><div>${(o.tags||[]).map(x=>`<span class="tag">${x}</span>`).join('')}</div></div></div>`}).join('')}</div>`
  :`<div class="card empty">${fl==='kan'?'Læg det, du har derhjemme, på Lager – så viser jeg, hvad du kan lave.':D.opskrifter.length?'Ingen opskrifter passer.':'Du har ingen opskrifter endnu. Tryk på »+ Ny opskrift«.'}</div>`}`;
},
madplan(){
  const dage=[...Array(7)].map((_,i)=>{const d=new Date(ugeStart);d.setDate(d.getDate()+i);return d});
  const uge=ugenr(ugeStart);const idag=iso(new Date());
  return `<h2>Madplan</h2>
  <div class="row" style="margin-bottom:14px"><button class="l" onclick="skiftUge(-1)">‹ Forrige</button><b style="flex:1;text-align:center">Uge ${uge} · ${dage[0].toLocaleDateString('da-DK',{day:'numeric',month:'short'})} – ${dage[6].toLocaleDateString('da-DK',{day:'numeric',month:'short'})}</b><button class="l" onclick="skiftUge(1)">Næste ›</button></div>
  <div class="week">${dage.map((d,i)=>{const k=iso(d),v=D.madplan[k]||{};return `<div class="day ${k===idag?'today':''}"><b>${DAGE[i]}</b><span class="muted">${d.toLocaleDateString('da-DK',{day:'numeric',month:'short'})}</span>
    <select onchange="setPlan('${k}','opskrift',this.value)"><option value="">– vælg opskrift –</option>${D.opskrifter.map(o=>`<option value="${o.id}" ${v.opskrift===o.id?'selected':''}>${esc(o.navn)}</option>`).join('')}</select>
    <input placeholder="eller skriv selv" value="${esc(v.tekst||'')}" onchange="setPlan('${k}','tekst',this.value)">${(()=>{const o=v.opskrift&&D.opskrifter.find(x=>x.id===v.opskrift);return o&&o.foto?`<div class="dimg" style="background-image:url(${o.foto})" onclick="visOpskrift('${o.id}')"></div>`:''})()}</div>`}).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="b" onclick="ugeTilIndkob()">🛒 Læg ugens ingredienser på indkøbslisten</button><button class="b" style="background:linear-gradient(135deg,#a855f7,#ff4d8d)!important" onclick="foreslaaUge()">✨ Foreslå ugen</button><button class="l" onclick="del('madplan')">📤 Del ugen</button></div>
  <p class="muted">Det, du allerede har nok af på lageret, kommer ikke på listen.</p>`;
},
indkob(){
  const ikke=D.indkob.filter(x=>!x.kobt),kobt=D.indkob.filter(x=>x.kobt);
  const li=x=>`<li class="${x.kobt?'done':''}"><input type="checkbox" ${x.kobt?'checked':''} onchange="kobt('${x.id}',this.checked)" style="width:22px;height:22px"><span class="n">${esc(ingTekst(x))}</span><input type="number" min="0" step="0.01" placeholder="pris kr" value="${x.pris??''}" style="width:100px" onchange="setPris('${x.id}',this.value)"><button class="x" title="Slet" onclick="sletVare('${x.id}')">✕</button></li>`;
  return `<h2>Indkøb</h2>
  <div class="card"><div class="row"><input class="grow" id="nyvare" placeholder="Fx 1 l mælk"><button class="b" onclick="tilfojVare()">Tilføj</button><button class="l" onclick="del('indkob')">📤 Del listen</button></div></div>
  <div class="card"><ul class="list">${ikke.length?ikke.map(li).join(''):'<li class="empty" style="justify-content:center">Indkøbslisten er tom.</li>'}</ul>${(()=>{const p=ikke.filter(x=>x.pris);return p.length?`<p class="muted" style="margin:10px 0 0">💡 Ca. ${kr(p.reduce((s,x)=>s+x.pris,0))} for ${p.length} af ${ikke.length} varer – ud fra dine egne priser.</p>`:''})()}</div>
  ${kobt.length?`<div class="card"><b>Købt (${kobt.length})</b><ul class="list">${kobt.map(li).join('')}</ul>
  <div class="row" style="margin-top:10px"><button class="b" onclick="kobtTilLager()">🥫 Flyt købte til lager</button></div>
  <p class="muted">Priser du har skrevet, bliver lagt i budgettet.</p></div>`:''}`;
},
lager(){
  const idag=new Date();idag.setHours(0,0,0,0);
  const s=[...D.lager].sort((a,b)=>(a.udlob||'9999').localeCompare(b.udlob||'9999')||a.navn.localeCompare(b.navn,'da'));
  return `<h2>Lager</h2>
  <div class="card"><div class="row"><input class="grow" id="nylager" placeholder="Fx 500 g pasta"><label style="margin:0">Holdbar til</label><input type="date" id="nyudlob"><button class="b" onclick="tilfojLager()">Tilføj</button></div></div>
  <div class="card"><ul class="list">${s.length?s.map(x=>{const dage=x.udlob?Math.round((new Date(x.udlob)-idag)/864e5):null;const soon=dage!=null&&dage<=3;
    return `<li class="${soon?'soon':''}"><span class="n">${esc(ingTekst(x))}</span>
    <span class="exp muted">${x.udlob?(dage<0?'Udløbet':dage===0?'Udløber i dag':'Holdbar til '+new Date(x.udlob).toLocaleDateString('da-DK',{day:'numeric',month:'short'})):''}</span>
    <button class="l" onclick="brugLager('${x.id}')">Brugt</button></li>`}).join(''):'<li class="empty" style="justify-content:center">Lageret er tomt.</li>'}</ul></div>
  ${kanLave()}
  <p class="muted">Varer der udløber inden for 3 dage, er farvet.</p>`;
},
budget(){
  const md=budgetMd,erNu=md===iso(new Date()).slice(0,7);
  const u=D.budget.udgifter.filter(x=>x.dato.slice(0,7)===md).sort((a,b)=>b.dato.localeCompare(a.dato));
  const brugt=u.reduce((s,x)=>s+x.belob,0),b=D.budget.maaned||0,pct=b?Math.min(100,brugt/b*100):0;
  const navn=new Date(md+'-01').toLocaleDateString('da-DK',{month:'long',year:'numeric'});
  const ind=D.budget.ind.filter(x=>x.dato.slice(0,7)===md),sumInd=ind.reduce((s,x)=>s+x.belob,0);
  const sumFaste=D.budget.faste.reduce((s,x)=>s+x.belob,0),sparetMd=sparetI(md),tilbage=sumInd-sumFaste-brugt-sparetMd;
  const nu=new Date(),dageIgen=new Date(nu.getFullYear(),nu.getMonth()+1,0).getDate()-nu.getDate()+1;
  const kort=x=>new Date(x.dato).toLocaleDateString('da-DK',{day:'numeric',month:'short'});
  return `<div class="row" style="margin-bottom:12px"><button class="l" onclick="skiftMd(-1)">‹</button><h2 style="flex:1;text-align:center;margin:0">Budget · ${navn}</h2><button class="l" onclick="skiftMd(1)">›</button></div>
  <div class="card" style="text-align:center"><div class="muted">Tilbage i ${navn.split(' ')[0]}</div>
  <div class="big" style="font-size:40px;color:${tilbage<0?'var(--warn)':'var(--acc)'}">${kr(tilbage)}</div>
  ${erNu&&tilbage>0?`<div class="muted">Det er ca. ${kr(Math.floor(tilbage/dageIgen))} pr. dag resten af måneden (${dageIgen} dage)</div>`:''}
  <div class="row" style="justify-content:center;gap:18px;margin-top:10px"><span>💵 Ind: <b>${kr(sumInd)}</b></span><span>🏠 Faste: <b>${kr(sumFaste)}</b></span><span>🛒 Køb: <b>${kr(brugt)}</b></span>${D.budget.maal.length?`<span>🐷 Sparet: <b>${kr(sparetMd)}</b></span>`:''}</div></div>
  ${tipsKort(sumInd,sumFaste,brugt,tilbage,erNu)}
  <div class="card" style="border:2px solid var(--acc)"><b>⚡ Hurtigt: sig det, skriv det eller tag et billede</b>
  <div class="muted" style="margin:4px 0 8px">Fx »løn 12.000«, »husleje 4500« eller »Netto 250«</div>
  <div class="row"><input class="grow" id="hurtig" placeholder="Skriv her…"><button class="b" onclick="hurtigTekst()" title="Videre">➜</button></div>
  <div class="row" style="margin-top:8px"><button class="b" id="mic" style="flex:1" onclick="talInd()">🎤 Tal ind</button><label class="b" style="font:inherit;flex:1;text-align:center;cursor:pointer;margin:0;color:#fff;background:var(--acc);border-radius:10px;padding:10px 16px">📷 Kvittering<input type="file" accept="image/*" capture="environment" hidden onchange="kvittering(this)"></label></div>
  <div id="hstatus" class="muted" style="margin-top:6px">${esc(hStatus)}</div>
  ${fs?`<div style="background:var(--acc2);border-radius:12px;padding:12px;margin-top:10px"><b>Er det rigtigt?</b>
   <div class="row" style="margin-top:8px"><select id="ftype"><option value="ind" ${fs.type==='ind'?'selected':''}>💵 Penge ind</option><option value="fast" ${fs.type==='fast'?'selected':''}>🏠 Fast udgift</option><option value="kob" ${fs.type==='kob'?'selected':''}>🛒 Køb</option></select>
   <input class="grow" id="fstekst" value="${esc(fs.tekst)}"><input type="text" inputmode="decimal" id="fsbelob" value="${fs.belob!=null?String(fs.belob).replace('.',','):''}" placeholder="kr"></div>
   <div class="row" style="margin-top:8px"><button class="b" onclick="gemForslag()">✓ Gem</button><button class="l" onclick="fs=null;hStatus='';vis()">Annullér</button></div></div>`:''}</div>
  <div class="card"><b>💵 Penge ind</b> <span class="muted">– fx løn eller SU, når du får den</span>
  <div class="row" style="margin-top:8px"><input class="grow" id="itekst" placeholder="Løn" value="Løn"><input type="text" inputmode="decimal" id="ibelob" placeholder="kr" style="width:120px"><button class="b" onclick="tilfojInd()">Tilføj</button></div>
  <ul class="list">${ind.map(x=>`<li><span class="muted" style="width:70px">${kort(x)}</span><span class="n">${esc(x.tekst)}</span><b>${kr(x.belob)}</b><button class="x" title="Slet" onclick="sletInd('${x.id}')">✕</button></li>`).join('')}</ul></div>
  <div class="card"><b>🏠 Faste udgifter hver måned</b> <span class="muted">– fx husleje, mobil, transport</span>
  <div class="row" style="margin-top:8px"><input class="grow" id="ftekst" placeholder="Fx Husleje"><input type="text" inputmode="decimal" id="fbelob" placeholder="kr" style="width:120px"><button class="b" onclick="tilfojFast()">Tilføj</button></div>
  <ul class="list">${D.budget.faste.map(x=>`<li><span class="n">${esc(x.tekst)}</span><b>${kr(x.belob)}</b><button class="x" title="Slet" onclick="sletFast('${x.id}')">✕</button></li>`).join('')}</ul></div>
  ${opsparingKort()}
  <h2 style="margin-top:22px">🛒 Køb</h2>
  <div class="card"><div class="row"><label style="margin:0">Budget til mad pr. måned</label><input type="text" inputmode="decimal" id="mbudget" value="${b||''}" placeholder="kr" style="width:140px"><button class="l" onclick="setBudget()">Gem</button></div>
  ${b?`<div class="bar"><i class="${brugt>b?'over':''}" style="width:${pct}%"></i></div>`:''}</div>
  <div class="stats"><div class="card"><div class="muted">Brugt</div><div class="big">${kr(brugt)}</div></div>
  <div class="card"><div class="muted">Tilbage</div><div class="big" style="color:${b&&brugt>b?'var(--warn)':'inherit'}">${b?kr(b-brugt):'–'}</div></div>
  <div class="card"><div class="muted">Antal køb</div><div class="big">${u.length}</div></div></div>
  <div class="card"><div class="row"><input type="date" id="udato" value="${datoIMd()}"><input class="grow" id="utekst" placeholder="Fx Netto"><input type="text" inputmode="decimal" id="ubelob" placeholder="kr" style="width:110px"><button class="b" onclick="tilfojUdgift()">Tilføj</button></div></div>
  <div class="card"><ul class="list">${u.length?u.map(x=>`<li><span class="muted" style="width:70px">${new Date(x.dato).toLocaleDateString('da-DK',{day:'numeric',month:'short'})}</span><span class="n">${esc(x.tekst)}</span><b>${kr(x.belob)}</b><button class="x" onclick="sletUdgift('${x.id}')">✕</button></li>`).join(''):'<li class="empty" style="justify-content:center">Ingen køb i denne måned.</li>'}</ul></div>
  <div class="card"><b>📄 CSV-fil</b><p class="muted">Gem ${navn} som en fil, der kan åbnes i Excel.</p><button class="b" onclick="csv()">⬇ Gem som CSV</button></div>
  <div class="card"><b>Sikkerhedskopi</b><p class="muted">Gem alle dine data i en fil, eller hent dem igen.</p><div class="row"><button class="l" onclick="eksport()">⬇ Gem kopi</button><label class="l" style="margin:0;cursor:pointer;color:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 14px">⬆ Hent kopi<input type="file" accept=".json" onchange="importer(this)" hidden></label></div></div>`;
}};

function ugenr(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y)/864e5+1)/7)}

function vis(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===side));
  document.getElementById('main').innerHTML=(side!=='forside'?banner(side):'')+SIDER[side]();
  const s=document.getElementById('soeg');if(s){s.oninput=()=>{window._q=s.value;const p=s.selectionStart;vis();const n=document.getElementById('soeg');n.focus();n.setSelectionRange(p,p)}}
  [['nyvare',tilfojVare],['nylager',tilfojLager],['ubelob',tilfojUdgift],['ibelob',tilfojInd],['hurtig',hurtigTekst],['fbelob',tilfojFast]].forEach(([i,f])=>{const e=document.getElementById(i);if(e)e.onkeydown=ev=>{if(ev.key==='Enter')f()}});
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{side=b.dataset.p;localStorage.setItem(KEY+'-side',side);vis();scrollTo(0,0)});

// Opskrifter
const dlg=document.getElementById('dlg'),dlgin=document.getElementById('dlgin');
let visPort=null;
function skal(i,o,p){if(i.maengde==null||!o.portioner)return{...i};let v=i.maengde*p/o.portioner;v=['','stk','fed','dåse','dåser'].includes(i.enhed)?Math.max(.5,Math.round(v*2)/2):Math.round(v*10)/10;return{...i,maengde:v}}
function visOpskrift(oid,p){
  const o=D.opskrifter.find(x=>x.id===oid);if(!o)return;
  p=p||o.portioner||4;visPort=p;const ing=o.ing.map(i=>skal(i,o,p)),mt=match(o);
  const dage=[...Array(7)].map((_,k)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+k);return d});
  dlgin.innerHTML=`${o.foto?`<div class="dfoto" style="background-image:url(${o.foto})"></div>`:''}<h2>${esc(o.navn)}</h2>
  <div>${o.tid?`<span class="tag">⏱️ ${o.tid} min</span>`:''}${(o.tags||[]).map(x=>`<span class="tag">${x}</span>`).join('')}${D.lager.length?`<span class="tag">🥫 Du har ${mt.har}/${mt.af}</span>`:''}</div>
  ${o.portioner?`<div class="port" style="margin-top:12px"><button class="l" onclick="visOpskrift('${o.id}',${Math.max(1,p-1)})">−</button><b>${p} personer</b><button class="l" onclick="visOpskrift('${o.id}',${p+1})">+</button></div>`:''}
  <h3>Ingredienser</h3><ul class="ingl">${ing.map(i=>{const h=iLager(i.navn);return `<li>${h?'✅':'▫️'} ${esc(ingTekst(i))}</li>`}).join('')||'<li class="muted">Ingen</li>'}</ul>
  ${o.trin&&o.trin.length?`<h3>Sådan gør du</h3><ol class="trin">${o.trin.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:o.frem?`<h3>Sådan gør du</h3><div style="white-space:pre-wrap">${esc(o.frem)}</div>`:''}
  <div class="row" style="margin-top:16px"><button class="b" onclick="opskriftTilIndkob('${o.id}')">🛒 På indkøbslisten</button><button class="b" onclick="document.getElementById('vdag').hidden=false">📅 På madplan</button><button class="b" onclick="lavRet('${o.id}')">👩‍🍳 Jeg har lavet den</button></div>
  <div id="vdag" hidden><p class="muted" style="margin:10px 0 6px">Hvilken dag?</p><div class="chips">${dage.map(d=>`<button class="chip" onclick="setPlan('${iso(d)}','opskrift','${o.id}');dlg.close();toast('${esc(o.navn)} er sat på ${d.toLocaleDateString('da-DK',{weekday:'long'})}')">${d.toLocaleDateString('da-DK',{weekday:'short',day:'numeric'})}</button>`).join('')}</div></div>
  <div class="row" style="margin-top:10px"><button class="l" onclick="del('opskrift:${o.id}')">📤 Del</button><button class="l" onclick="redigerOpskrift('${o.id}')">Ret</button><button class="l" onclick="sletOpskrift('${o.id}')">Slet</button><button class="l" onclick="dlg.close()">Luk</button></div>
  <p class="muted" style="font-size:13px">✅ = det har du på lager. Salt, peber og vand regner vi med, at du har.</p>`;
  if(!dlg.open)dlg.showModal();
}
function lavRet(oid){
  const o=D.opskrifter.find(x=>x.id===oid);if(!o)return;const s=snap();let n=0;
  o.ing.map(i=>skal(i,o,visPort||o.portioner)).forEach(i=>{const l=iLager(i.navn);if(!l||l.basis)return;n++;
    if(l.maengde==null){D.lager=D.lager.filter(x=>x!==l);return}if(i.maengde==null)return;const a=base(l),b=base(i);if(a.k!==b.k)return;const rest=(a.v-b.v)/(ENH[l.enhed]?ENH[l.enhed][1]:1);if(rest<=0.0001)D.lager=D.lager.filter(x=>x!==l);else l.maengde=Math.round(rest*100)/100});
  save();dlg.close();vis();toast(n?'Velbekomme! '+n+' varer er trukket fra lageret 😋':'Velbekomme! 😋',n?fortrydTil(s):null);
}
function redigerOpskrift(oid){
  const o=D.opskrifter.find(x=>x.id===oid)||{navn:'',portioner:'',ing:[],frem:''};
  dlgin.innerHTML=`<h2>${oid?'Ret opskrift':'Ny opskrift'}</h2>
  <label>Navn</label><input id="onavn" style="width:100%" value="${esc(o.navn)}">
  <label>Portioner</label><input id="oport" type="number" min="1" style="width:100px" value="${o.portioner||''}">
  <label>Ingredienser (én pr. linje, fx »200 g mel«)</label><textarea id="oing">${esc(o.ing.map(ingTekst).join('\n'))}</textarea>
  <label>Sådan gør du${o.trin?' (ét trin pr. linje)':''}</label><textarea id="ofrem">${esc(o.trin?o.trin.join('\n'):o.frem)}</textarea>
  <div class="row" style="margin-top:14px"><button class="b" onclick="gemOpskrift('${oid||''}')">Gem</button><button class="l" onclick="dlg.close()">Annullér</button></div>`;
  if(!dlg.open)dlg.showModal();
}
function gemOpskrift(oid){
  const navn=document.getElementById('onavn').value.trim();if(!navn){alert('Skriv et navn');return}
  const gl=D.opskrifter.find(x=>x.id===oid)||{},frem=document.getElementById('ofrem').value.trim();
  const o={...gl,id:oid||id(),navn,portioner:parseInt(document.getElementById('oport').value)||null,
    ing:document.getElementById('oing').value.split('\n').filter(l=>l.trim()).map(parseIng),frem:gl.trin?'':frem};
  if(gl.trin)o.trin=frem.split('\n').map(s=>s.trim()).filter(Boolean);
  const i=D.opskrifter.findIndex(x=>x.id===oid);if(i>=0)D.opskrifter[i]=o;else D.opskrifter.push(o);
  save();dlg.close();vis();toast('Opskriften er gemt');
}
function sletOpskrift(oid){const s=snap();if(String(oid).startsWith('std-'))D.stdSlettet.push(oid);D.opskrifter=D.opskrifter.filter(x=>x.id!==oid);save();dlg.close();vis();toast('Opskriften er slettet',fortrydTil(s))}
function opskriftTilIndkob(oid){const s=snap();const o=D.opskrifter.find(x=>x.id===oid);const n=tilIndkob(o.ing.map(i=>skal(i,o,visPort||o.portioner)));save();dlg.close();vis();toast(n?n+' varer lagt på indkøbslisten':'Du har det hele på lageret',n?fortrydTil(s):null)}

// Madplan
function skiftUge(n){ugeStart.setDate(ugeStart.getDate()+7*n);vis()}
function setPlan(k,f,v){D.madplan[k]=D.madplan[k]||{};D.madplan[k][f]=v;if(!D.madplan[k].opskrift&&!D.madplan[k].tekst)delete D.madplan[k];save()}
function ugeTilIndkob(){
  const s=snap();let ings=[];
  for(let i=0;i<7;i++){const d=new Date(ugeStart);d.setDate(d.getDate()+i);const v=D.madplan[iso(d)];if(v&&v.opskrift){const o=D.opskrifter.find(x=>x.id===v.opskrift);if(o)ings=ings.concat(o.ing.map(x=>({...x})))}}
  if(!ings.length){toast('Vælg opskrifter i ugen først');return}
  const n=tilIndkob(ings);save();toast(n?n+' varer lagt på indkøbslisten':'Du har det hele på lageret',n?fortrydTil(s):null);
}

// Indkøb
function tilfojVare(){const e=document.getElementById('nyvare');if(!e.value.trim())return;const p=parseIng(e.value);D.indkob.push({id:id(),...p,pris:D.priser[norm(p.navn)]??null,kobt:false});save();vis();document.getElementById('nyvare').focus()}
function kobt(vid,v){D.indkob.find(x=>x.id===vid).kobt=v;save();vis()}
function setPris(vid,v){D.indkob.find(x=>x.id===vid).pris=v===''?null:parseFloat(v);save()}
function sletVare(vid){const s=snap();D.indkob=D.indkob.filter(x=>x.id!==vid);save();vis();toast('Varen er slettet',fortrydTil(s))}
function kobtTilLager(){
  const s=snap();const k=D.indkob.filter(x=>x.kobt);let sum=0;
  k.forEach(x=>{const l=D.lager.find(y=>sammeNavn(y.navn,x.navn)&&y.enhed===x.enhed);
    if(l&&l.maengde!=null&&x.maengde!=null)l.maengde+=x.maengde;else if(!l)D.lager.push({id:id(),navn:x.navn,maengde:x.maengde,enhed:x.enhed,udlob:''});
    if(x.pris){sum+=x.pris;D.priser[norm(x.navn)]=x.pris}});
  if(sum)D.budget.udgifter.push({id:id(),dato:iso(new Date()),tekst:'Indkøb ('+k.length+' varer)',belob:sum});
  D.indkob=D.indkob.filter(x=>!x.kobt);save();vis();toast(k.length+' varer flyttet til lager'+(sum?' · '+kr(sum)+' i budget':''),fortrydTil(s));
}

// Lager
function tilfojLager(){const e=document.getElementById('nylager');if(!e.value.trim())return;D.lager.push({id:id(),...parseIng(e.value),udlob:document.getElementById('nyudlob').value});save();vis();document.getElementById('nylager').focus()}
function brugLager(lid){const s=snap();D.lager=D.lager.filter(x=>x.id!==lid);save();vis();toast('Fjernet fra lager',fortrydTil(s))}

// Budget
function setBudget(){D.budget.maaned=tal('mbudget')||0;save();vis();toast('Budget gemt')}
function tilfojUdgift(){const b=tal('ubelob');if(!b){alert('Skriv et beløb');return}D.budget.udgifter.push({id:id(),dato:document.getElementById('udato').value||iso(new Date()),tekst:document.getElementById('utekst').value.trim()||'Køb',belob:b});save();vis()}
function skiftMd(n){const d=new Date(budgetMd+'-01');d.setMonth(d.getMonth()+n);budgetMd=iso(d).slice(0,7);vis()}
function datoIMd(){const i=iso(new Date());return i.slice(0,7)===budgetMd?i:budgetMd+'-01'}
function tal(id){let v=String(document.getElementById(id).value).replace(/\s|kr\.?/gi,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');return parseFloat(v)}
function tilfojInd(){const b=tal('ibelob');if(!b){alert('Skriv et beløb');return}D.budget.ind.push({id:id(),dato:datoIMd(),tekst:document.getElementById('itekst').value.trim()||'Løn',belob:b});save();vis();toast('Penge ind er gemt')}

let fs=null,hStatus='';
const ORD=(l,g)=>new RegExp('(?<!\\p{L})('+l+')(?!\\p{L})','iu'+(g||''));const ORD_IND=ORD('løn|su|indtægt|fik|lommepenge|børnepenge|boligstøtte|ydelse|overført|gave');
const ORD_FAST=ORD('husleje|leje|mobil|telefon|abonnement|netflix|spotify|hbo|viaplay|disney|forsikring|internet|el|vand|varme|fitness|kontingent|hver måned|fast|faste|månedskort|rejsekort|a-kasse|fagforening|lån|afdrag');
function forstaa(t){
  t=t.trim();
  const m=t.match(/(\d{1,3}(?:[.\s]\d{3})+|\d+)(?:,(\d{1,2}))?/);
  let belob=null;if(m)belob=parseFloat(m[1].replace(/[.\s]/g,'')+(m[2]?'.'+m[2]:''));
  let tekst=(m?t.replace(m[0],' '):t).replace(ORD('kroner|kr\\.?|jeg|har|fik|betalt|betalte|brugt|brugte|til|på|for|i|om|måneden|hver','g'),' ').replace(/\s+/g,' ').trim();
  const type=ORD_IND.test(t)?'ind':ORD_FAST.test(t)?'fast':'kob';
  if(!tekst)tekst=type==='ind'?'Løn':type==='fast'?'Fast udgift':'Køb';
  return{type,tekst:tekst.charAt(0).toUpperCase()+tekst.slice(1),belob};
}

let rec=null;
function talInd(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){hStatus='Tale virker ikke i denne browser. Tryk i feltet og brug mikrofonen på tastaturet i stedet.';vis();return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang='da-DK';rec.interimResults=false;rec.maxAlternatives=1;
  const knap=document.getElementById('mic');knap.textContent='🔴 Lytter… (tryk for stop)';
  document.getElementById('hstatus').textContent='Sig fx »husleje 4500«';
  rec.onresult=e=>{const t=e.results[0][0].transcript;visForslag(forstaa(t),'Jeg hørte: »'+t+'«')};
  rec.onerror=e=>{hStatus=e.error==='not-allowed'?'Giv lov til mikrofonen og prøv igen.':'Jeg hørte ikke noget. Prøv igen.';vis()};
  rec.onend=()=>{rec=null;const k=document.getElementById('mic');if(k)k.textContent='🎤 Tal ind'};
  rec.start();
}
function hentTesseract(){return window.Tesseract?Promise.resolve():new Promise((ok,fejl)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>fejl(new Error('net'));document.head.appendChild(s)})}
function laesKvittering(tekst){
  const linjer=tekst.split('\n').map(l=>l.trim()).filter(Boolean);
  const pris=l=>{const m=[...l.matchAll(/(\d{1,3}(?:[.\s]\d{3})*|\d+)[,.](\d{2})\b/g)];return m.length?parseFloat(m[m.length-1][1].replace(/[.\s]/g,'')+'.'+m[m.length-1][2]):null};
  let belob=null;
  for(const l of linjer){if(/(total|i alt|ialt|at betale|til betaling|beløb|sum)/i.test(l)&&pris(l)!=null)belob=pris(l)}
  const butik=(linjer.find(l=>/[a-zæøå]{3,}/i.test(l))||'Køb').replace(/[^\wæøåÆØÅ&\- ]/g,'').trim().slice(0,30);
  const dm=tekst.match(/\b(\d{1,2})[.\-/](\d{1,2})[.\-/](20\d{2}|\d{2})\b/);
  let dato=null;if(dm){const y=dm[3].length===2?'20'+dm[3]:dm[3];dato=y+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0')}
  return{type:'kob',tekst:butik||'Køb',belob,dato};
}
async function kvittering(inp){
  const f=inp.files[0];if(!f)return;
  hStatus='Læser kvitteringen… (første gang tager det lidt længere)';vis();
  try{
    await hentTesseract();
    const r=await Tesseract.recognize(f,'dan',{logger:m=>{if(m.status==='recognizing text'){const e=document.getElementById('hstatus');if(e)e.textContent='Læser kvitteringen… '+Math.round(m.progress*100)+' %'}}});
    const k=laesKvittering(r.data.text);
    visForslag(k,k.belob!=null?'Fundet på kvitteringen. Tjek at det passer.':'Jeg kunne ikke finde totalen. Skriv beløbet selv.');
  }catch(e){hStatus=e.message==='net'?'Kræver internet første gang. Prøv igen, når du er online.':'Billedet kunne ikke læses. Prøv et skarpere billede.';vis()}
}

  if(!dlg.open)dlg.showModal();
}
if(erMobil&&!erInstalleret){
  document.getElementById('instknap').style.display='';
  if(!localStorage.getItem(KEY+'-guide'))setTimeout(visGuide,800);
}

// ---------- Sikre opdateringer (version 8) ----------
document.getElementById('ver').textContent='version '+APP_VERSION;
if(localStorage.getItem(KEY+'-fejl')){localStorage.removeItem(KEY+'-fejl');setTimeout(()=>toast('Den nye opdatering havde en fejl. Du kører videre på den gamle version – intet er tabt.'),600)}
function visOpdatering(w){
  if(document.getElementById('opd'))return;
  if(Date.now()<+(localStorage.getItem(KEY+'-vent')||0))return;
  fetch('version.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({})).then(v=>{
    const d=document.createElement('div');d.className='opd';d.id='opd';
    d.innerHTML=`<b style="font-size:18px">✨ Ny opdatering${v.version?' – version '+v.version:''}</b>${v.nyt?`<p style="margin:6px 0">${esc(v.nyt)}</p>`:''}<p class="muted" style="margin:4px 0 10px">Du bestemmer selv. Appen virker fint på den version, du har nu.</p><div class="row"><button class="b" style="flex:1" id="opdja">Opdater nu</button><button class="l" id="opdvent">Vent med at opdatere</button></div>`;
    document.body.appendChild(d);
    document.getElementById('opdja').onclick=()=>{localStorage.setItem(KEY+'-test',Date.now());d.innerHTML='<b>Opdaterer…</b>';w.postMessage('OPDATER')};
    document.getElementById('opdvent').onclick=()=>{localStorage.setItem(KEY+'-vent',Date.now()+864e5);d.remove();toast('OK – jeg spørger igen i morgen')};
  });
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  let genstart=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(localStorage.getItem(KEY+'-test')&&!genstart){genstart=true;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const tjek=()=>{if(reg.waiting&&navigator.serviceWorker.controller)visOpdatering(reg.waiting)};
    tjek();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed')tjek()})});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
  });
}

// ---------- Del med en ven (uden server) ----------
function delLink(type,data){return location.origin+location.pathname+'#del='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({type,data,fra:'Budget og Mad'})))))}
async function del(type){
  let data,titel;
  if(type==='indkob'){data=D.indkob.filter(x=>!x.kobt).map(x=>({navn:x.navn,maengde:x.maengde,enhed:x.enhed}));titel='min indkøbsliste';if(!data.length){toast('Listen er tom');return}}
  else if(type==='madplan'){data={};for(let i=0;i<7;i++){const d=new Date(ugeStart);d.setDate(d.getDate()+i);const v=D.madplan[iso(d)];if(v){const o=v.opskrift&&D.opskrifter.find(x=>x.id===v.opskrift);data[iso(d)]=o?{navn:o.navn,opskrift:o}:{tekst:v.tekst}}}titel='ugens madplan';if(!Object.keys(data).length){toast('Madplanen er tom');return}}
  else if(type.startsWith('opskrift:')){const o=D.opskrifter.find(x=>x.id===type.slice(9));data=o;type='opskrift';titel='opskriften på '+o.navn}
  const url=delLink(type,data),tekst='Her er '+titel+' fra Budget og Mad 🍲';
  if(navigator.share){try{await navigator.share({title:'Budget og Mad',text:tekst,url});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(tekst+'\n'+url);toast('Linket er kopieret – send det til din ven')}catch(e){prompt('Kopiér linket og send det:',url)}
}
function modtagDel(){
  if(!location.hash.startsWith('#del='))return;
  let p;try{p=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(5))))))}catch(e){return}
  history.replaceState(null,'',location.pathname);
  const navn={indkob:'en indkøbsliste',madplan:'en madplan',opskrift:'en opskrift'}[p.type];if(!navn)return;
  dlgin.innerHTML=`<h2>📥 Du har fået ${navn}</h2><p class="muted">Kun det, din ven har valgt at dele, er med. Intet andet fra din ven kommer ind i din app.</p>
  ${p.type==='indkob'?`<ul class="ingl">${p.data.map(x=>`<li>${esc(ingTekst(x))}</li>`).join('')}</ul>`:p.type==='madplan'?`<ul class="ingl">${Object.entries(p.data).map(([k,v])=>`<li>${new Date(k).toLocaleDateString('da-DK',{weekday:'long'})}: ${esc(v.navn||v.tekst)}</li>`).join('')}</ul>`:`<p><b>${esc(p.data.navn)}</b></p>`}
  <div class="row" style="margin-top:12px"><button class="b" id="tagimod" style="flex:1">Tilføj til min app</button><button class="l" onclick="dlg.close()">Nej tak</button></div>`;
  dlg.showModal();
  document.getElementById('tagimod').onclick=()=>{const s=snap();
    if(p.type==='indkob')p.data.forEach(x=>D.indkob.push({id:id(),navn:String(x.navn),maengde:x.maengde??null,enhed:String(x.enhed||''),pris:D.priser[norm(x.navn)]??null,kobt:false}));
    if(p.type==='opskrift'||p.type==='madplan'){const tilf=o=>{let e=D.opskrifter.find(x=>x.navn===o.navn);if(!e){e={id:id(),navn:String(o.navn),portioner:o.portioner||null,ing:(o.ing||[]).map(i=>({navn:String(i.navn),maengde:i.maengde??null,enhed:String(i.enhed||'')})),trin:Array.isArray(o.trin)?o.trin.map(String):undefined,frem:String(o.frem||''),tags:Array.isArray(o.tags)?o.tags.map(String):[],tid:+o.tid||null,foto:/^fotos\/retter\/[a-z]+\.jpg$/.test(o.foto||'')?o.foto:''};D.opskrifter.push(e)}return e};
      if(p.type==='opskrift')tilf(p.data);else Object.entries(p.data).forEach(([k,v])=>{if(!/^\d{4}-\d\d-\d\d$/.test(k))return;D.madplan[k]=v.opskrift?{opskrift:tilf(v.opskrift).id}:{tekst:String(v.tekst||'')}})}
    save();dlg.close();gaaTil(p.type==='indkob'?'indkob':p.type==='madplan'?'madplan':'opskrifter');toast('Tilføjet ✔',fortrydTil(s))};
}
modtagDel();

// ---------- Skriv til hjælperen ----------
let hjaelpFil=null;
async function sendHjaelp(){
  const tekst=document.getElementById('hjtekst').value.trim();if(!tekst&&!hjaelpFil){alert('Skriv hvad du har brug for hjælp til');return}
  const msg='Hej '+EJER+'! Jeg har brug for hjælp med Budget og Mad (version '+APP_VERSION+'):\n\n'+tekst;
  if(navigator.share){const d={title:'Hjælp til Budget og Mad',text:msg};if(hjaelpFil&&navigator.canShare&&navigator.canShare({files:[hjaelpFil]}))d.files=[hjaelpFil];try{await navigator.share(d);return}catch(e){if(e.name==='AbortError')return}}
  location.href='mailto:?subject='+encodeURIComponent('Hjælp til Budget og Mad')+'&body='+encodeURIComponent(msg+(hjaelpFil?'\n\n(Husk at vedhæfte dit skærmbillede)':''));
}
function hjaelpKort(){
  return `<div class="card" style="margin-top:14px"><b>💬 Brug for hjælp?</b><p class="muted" style="margin:4px 0 8px">Skriv til ${esc(EJER)}. Du kan sætte et skærmbillede på. Det er kun det, du selv skriver og vælger, der bliver sendt – appen sender aldrig noget af sig selv.</p>
  <textarea id="hjtekst" placeholder="Hvad driller?" style="min-height:70px"></textarea>
  <div class="row" style="margin-top:8px"><label class="l" style="margin:0;cursor:pointer;color:inherit;background:var(--felt);border-radius:14px;padding:9px 14px;font-weight:600">📷 Skærmbillede<input type="file" accept="image/*" hidden onchange="hjaelpFil=this.files[0]||null;document.getElementById('hjfil').textContent=hjaelpFil?'✔ '+hjaelpFil.name:''"></label><span id="hjfil" class="muted"></span><button class="b" style="margin-left:auto" onclick="sendHjaelp()">Send ➜</button></div></div>
  <div class="card"><b>ℹ️ Om appen</b><p class="muted" style="margin:6px 0 0">Budget og Mad – version ${APP_VERSION}. © ${esc(EJER)}. Appen tilhører ${esc(EJER)}, og kun ${esc(EJER)} kan sende opdateringer. Den må ikke kopieres eller deles videre uden tilladelse. Dine tal ligger kun på din egen telefon. Fotos fra Unsplash.</p></div>`;
}
