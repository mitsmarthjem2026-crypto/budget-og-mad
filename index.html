<div class="toast" id="toast"><span id="tmsg"></span><button id="tundo">Fortryd</button></div>
<dialog id="dlg"><div class="in" id="dlgin"></div></dialog>

<script>
const KEY='madapp-v1';const APP_VERSION=37, EJER='Søren';
let D;try{D=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){D=null;try{localStorage.setItem(KEY+'-skadet-'+Date.now(),localStorage.getItem(KEY))}catch(x){}}
if(!D||typeof D!=='object')D={};
['opskrifter','indkob','lager','stdSlettet','gemteLister'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});
['madplan','priser','indstil'].forEach(k=>{if(!D[k]||typeof D[k]!=='object'||Array.isArray(D[k]))D[k]={}});
if(!D.budget||typeof D.budget!=='object')D.budget={maaned:0,udgifter:[]};['udgifter','ind','faste','maal'].forEach(k=>{if(!Array.isArray(D.budget[k]))D.budget[k]=[]});
D.opskrifter=D.opskrifter.filter(o=>o&&o.id&&o.navn).map(o=>({...o,ing:Array.isArray(o.ing)?o.ing.filter(i=>i&&i.navn):[],tags:Array.isArray(o.tags)?o.tags:[]}));
D.indkob=D.indkob.filter(x=>x&&x.navn);D.lager=D.lager.filter(x=>x&&x.navn);

// Faste opskrifter (klassiske, billige retter). Fotos: se kilder.txt

const BASIS=['salt','peber','vand'];
const norm=s=>String(s||'').toLowerCase().replace(/[^a-zæøå ]/g,' ').replace(/\s+/g,' ').trim();
const STOP=['hakket','hakkede','kogte','kogt','frisk','friske','frosne','stk','og','af','til','rester','gerne','skiver','glas','revet','revne','grøn','rød'];
const tok=s=>norm(s).split(' ').filter(w=>w.length>1&&!STOP.includes(w));
function iLager(navn){const n=norm(navn);if(BASIS.includes(n))return{basis:true};const w=tok(navn);if(!w.length)return null;return D.lager.find(l=>{const a=tok(l.navn);return a.length&&(a.every(x=>w.includes(x))||w.every(x=>a.includes(x)))})}
const ENH={g:['m',1],kg:['m',1000],ml:['v',1],cl:['v',10],dl:['v',100],l:['v',1000]};
function base(i){const e=ENH[i.enhed];return e?{k:e[0],v:i.maengde*e[1]}:{k:i.enhed,v:i.maengde}}
function nokPaaLager(l,i){if(l.basis||l.maengde==null||i.maengde==null)return true;const a=base(l),b=base(i);return a.k===b.k&&a.v>=b.v}
function match(o){const ing=o.ing.filter(i=>!BASIS.includes(norm(i.navn)));const har=ing.filter(i=>iLager(i.navn)).length;return{har,af:ing.length,pct:ing.length?har/ing.length:0}}

D.budget.ind=D.budget.ind||[];D.budget.faste=D.budget.faste||[];D.budget.maal=D.budget.maal||[];D.priser=D.priser||{};D.stdSlettet=D.stdSlettet||[];
flet();
let budgetMd=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
let side='forside';if(['#forside','#opskrifter','#madplan','#indkob','#lager','#budget'].includes(location.hash))side=location.hash.slice(1);
let ugeStart=mandag(new Date());
var STD_IDS=null;function erStd(x){if(!STD_IDS)STD_IDS=new Set(STD_OPSKRIFTER.map(s=>s.id));return STD_IDS.has(x)}
const tilGem=()=>JSON.stringify({...D,opskrifter:D.opskrifter.filter(o=>!erStd(o.id)||o.rettet)});
function flet(){D.opskrifter=(D.opskrifter||[]).filter(o=>!erStd(o.id)||o.rettet);D.stdSlettet=D.stdSlettet||[];
  STD_OPSKRIFTER.forEach(s=>{if(!D.opskrifter.some(o=>o.id===s.id)&&!D.stdSlettet.includes(s.id))D.opskrifter.push({...s,ing:s.ing.map(parseIng),trin:[...s.trin],tags:[...s.tags]})})}
let HIST=[],sidst=tilGem();
const save=()=>{const ny=tilGem();if(ny===sidst)return;if(sidst){HIST.push(sidst);if(HIST.length>30)HIST.shift()}sidst=ny;try{localStorage.setItem(KEY,ny)}catch(e){alert('Telefonen har ikke mere plads til appens data. Gem en kopi, og slet evt. dit eget foto.')}visFortrydKnap()};
function visFortrydKnap(){const b=document.getElementById('fortrydknap');if(b){b.hidden=!HIST.length;b.title='Fortryd ('+HIST.length+')'}}
function fortrydSidste(){if(!HIST.length)return;const s=HIST.pop();D=JSON.parse(s);flet();sidst=s;localStorage.setItem(KEY,s);if(window.brugFoto)brugFoto();if(window.brugIndstil)brugIndstil();if(dlg.open)dlg.close();vis();visFortrydKnap();toast('↩️ Fortrudt'+(HIST.length?' – tryk igen for at fortryde mere':''))}
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kr=n=>{n=Math.round(n*100)/100;return n.toLocaleString('da-DK',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+' kr'};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function mandag(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
const DAGE=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];

let undoFn=null,tT;
function toast(msg,undo){const t=document.getElementById('toast');document.getElementById('tmsg').textContent=msg;undoFn=undo;document.getElementById('tundo').style.display=undo?'':'none';t.style.display='flex';clearTimeout(tT);tT=setTimeout(()=>t.style.display='none',8000)}
document.getElementById('tundo').onclick=()=>{if(undoFn){undoFn();save();if(window.brugFoto)brugFoto();if(window.brugIndstil)brugIndstil();vis()}document.getElementById('toast').style.display='none'};
function snap(){return JSON.stringify(D)}
function fortrydTil(s){return()=>{D=JSON.parse(s);flet()}}

// "200 g mel" -> {maengde:200, enhed:'g', navn:'mel'}
function parseIng(linje){
  const m=linje.trim().match(/^([\d]+(?:[.,]\d+)?)\s*(g|kg|ml|dl|cl|l|stk|spsk|tsk|knsp|fed|dåse|dåser|pakke|pk|bundt)?\.?\s+(.+)$/i);
  if(m)return{maengde:parseFloat(m[1].replace(',','.')),enhed:(m[2]||'').toLowerCase(),navn:m[3].trim()};
  return{maengde:null,enhed:'',navn:linje.trim()};
}
const ingTekst=i=>(i.maengde!=null?(String(i.maengde).replace('.',',')+' '):'')+(i.enhed?i.enhed+' ':'')+i.navn;
const sammeNavn=(a,b)=>a.trim().toLowerCase()===b.trim().toLowerCase();

function tilIndkob(ings){
  let n=0;
  ings.forEach(i=>{
    const paaLager=iLager(i.navn);
    if(paaLager&&nokPaaLager(paaLager,i))return;
    const fin=D.indkob.find(x=>!x.kobt&&sammeNavn(x.navn,i.navn)&&x.enhed===i.enhed);
    if(fin){if(fin.maengde!=null&&i.maengde!=null)fin.maengde+=i.maengde}
    else D.indkob.push({id:id(),navn:i.navn,maengde:i.maengde,enhed:i.enhed,pris:D.priser[norm(i.navn)]??null,kobt:false});
    n++;
  });
  return n;
}

const SIDER={
opskrifter(){
  const q=(window._q||'').toLowerCase(),fl=window._fl||'alle',kt=window._kat||'';
  const KATS=[...new Set(D.opskrifter.map(o=>o.kat).filter(Boolean))];
  const F={alle:'Alle',dansk:'🇩🇰 Dansk',vegetar:'🥕 Vegetar',hurtig:'⏱️ Hurtig',kan:'🥫 Kan laves nu',mine:'⭐ Mine'};
  let liste=D.opskrifter.filter(o=>!q||o.navn.toLowerCase().includes(q)||o.ing.some(i=>i.navn.toLowerCase().includes(q)));
  if(fl==='kan')liste=liste.filter(o=>match(o).pct>=.6).sort((a,b)=>match(b).pct-match(a).pct);
  else if(fl==='mine')liste=liste.filter(o=>!erStd(o.id));
  else if(fl==='hurtig')liste=liste.filter(o=>(o.tags||[]).includes('hurtig')||(o.tid&&o.tid<=30));
  else if(fl!=='alle')liste=liste.filter(o=>(o.tags||[]).includes(fl));
  if(kt)liste=liste.filter(o=>o.kat===kt);
  const antal=liste.length,vis_=window._visN||40;liste=liste.slice(0,vis_);
  return `<h2>Opskrifter</h2>
  <div class="row" style="margin-bottom:12px"><button class="b" style="flex:1" onclick="visPengeDialog()">💰 Hvad kan jeg få for pengene?</button><button class="b" style="flex:1" onclick="visHarDialog()">🧺 Hvad kan jeg lave?</button><button class="l" onclick="visOpskriftHjaelp()">❓ Hjælp</button></div>
  <div class="row" style="margin-bottom:12px"><input class="grow" id="soeg" placeholder="Søg i opskrifter eller ingredienser" value="${esc(window._q||'')}"><button class="b" onclick="redigerOpskrift()">+ Ny opskrift</button><label class="l" style="margin:0;cursor:pointer;color:inherit;background:var(--felt);border-radius:14px;padding:10px 14px;font-weight:600">📷 Foto af opskrift<input type="file" accept="image/*" capture="environment" hidden onchange="fotoOpskrift(this)"></label></div><div id="ostatus" class="muted"></div>
  <div class="chips">${Object.entries(F).map(([k,v])=>`<button class="chip ${fl===k?'on':''}" onclick="window._fl='${k}';window._visN=40;vis()">${v}</button>`).join('')}</div>
  <div class="chips kats"><button class="chip ${kt?'':'on'}" onclick="window._kat='';window._visN=40;vis()">Alle slags</button>${KATS.map(k=>`<button class="chip ${kt===k?'on':''}" onclick="window._kat='${k}';window._visN=40;vis()">${k}</button>`).join('')}</div>
  <p class="muted" style="margin:0 0 10px">${antal} opskrifter${q||fl!=='alle'||kt?' passer':''}</p>
  ${liste.length?`<div class="grid">${liste.map(o=>{const mt=match(o);return `<div class="card rc rkort" onclick="visOpskrift('${o.id}')"><div class="rfoto ${o.foto?'':'tom'}" ${o.foto?`style="background-image:url(${o.foto})"`:''}>${o.foto?'':'🍽️'}${D.lager.length&&mt.har?`<span class="harbadge">✅ ${mt.har}/${mt.af}</span>`:''}</div><div class="rinfo"><h3>${esc(o.navn)}</h3><div class="muted">${o.tid?'⏱️ '+o.tid+' min · ':''}${o.portioner?o.portioner+' pers. · ':''}${o.ing.length} ingredienser</div><div>${(o.tags||[]).map(x=>`<span class="tag">${x}</span>`).join('')}</div></div></div>`}).join('')}</div>${antal>liste.length?`<button class="b" style="width:100%;margin-top:14px" onclick="window._visN=(window._visN||40)+40;vis()">Vis flere (${antal-liste.length} mere)</button>`:''}`
  :`<div class="card empty">${fl==='kan'?'Læg det, du har derhjemme, på Lager – så viser jeg, hvad du kan lave.':D.opskrifter.length?'Ingen opskrifter passer.':'Du har ingen opskrifter endnu. Tryk på »+ Ny opskrift«.'}</div>`}`;
},
madplan(){
  const dage=[...Array(7)].map((_,i)=>{const d=new Date(ugeStart);d.setDate(d.getDate()+i);return d});
  const uge=ugenr(ugeStart);const idag=iso(new Date());
  return `<h2>Madplan</h2>
  <div class="row" style="margin-bottom:14px"><button class="l" onclick="skiftUge(-1)">‹ Forrige</button><b style="flex:1;text-align:center">Uge ${uge} · ${dage[0].toLocaleDateString('da-DK',{day:'numeric',month:'short'})} – ${dage[6].toLocaleDateString('da-DK',{day:'numeric',month:'short'})}</b><button class="l" onclick="skiftUge(1)">Næste ›</button></div>
  <div class="week">${dage.map((d,i)=>{const k=iso(d),v=D.madplan[k]||{};return `<div class="day ${k===idag?'today':''}">${v.opskrift||v.tekst?`<button class="x" style="float:right" title="Ryd dagen" onclick="rydDag('${k}')">🗑️</button>`:''}<b>${DAGE[i]}</b><span class="muted">${d.toLocaleDateString('da-DK',{day:'numeric',month:'short'})}</span>
    <select onchange="setPlan('${k}','opskrift',this.value)"><option value="">– vælg opskrift –</option>${D.opskrifter.map(o=>`<option value="${o.id}" ${v.opskrift===o.id?'selected':''}>${esc(o.navn)}</option>`).join('')}</select>
    <input placeholder="eller skriv selv" value="${esc(v.tekst||'')}" onchange="setPlan('${k}','tekst',this.value)">${(()=>{const o=v.opskrift&&D.opskrifter.find(x=>x.id===v.opskrift);return o&&o.foto?`<div class="dimg" style="background-image:url(${o.foto})" onclick="visOpskrift('${o.id}')"></div>`:''})()}</div>`}).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="b" onclick="ugeTilIndkob()">🛒 Læg ugens ingredienser på indkøbslisten</button><button class="b" onclick="foreslaaUge()">✨ Foreslå ugen</button><button class="l" onclick="del('madplan')">📤 Del ugen</button></div>
  <p class="muted">Det, du allerede har nok af på lageret, kommer ikke på listen.</p>`;
},

function ugenr(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y)/864e5+1)/7)}

  document.getElementById('main').innerHTML=(side!=='forside'?banner(side):'')+SIDER[side]();
  const s=document.getElementById('soeg');if(s){s.oninput=()=>{window._q=s.value;const p=s.selectionStart;vis();const n=document.getElementById('soeg');n.focus();n.setSelectionRange(p,p)}}
  [['nyvare',tilfojVare],['nylager',tilfojLager],['ubelob',tilfojUdgift],['ibelob',tilfojInd],['hurtig',hurtigTekst],['fbelob',tilfojFast]].forEach(([i,f])=>{const e=document.getElementById(i);if(e)e.onkeydown=ev=>{if(ev.key==='Enter')f()}});
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{side=b.dataset.p;localStorage.setItem(KEY+'-side',side);vis();scrollTo(0,0)});

const dlg=document.getElementById('dlg'),dlgin=document.getElementById('dlgin');dlg.addEventListener('close',()=>{window._enKat=null;if(window.speechSynthesis)speechSynthesis.cancel()});
let visPort=null;
function skal(i,o,p){if(i.maengde==null||!o.portioner)return{...i};let v=i.maengde*p/o.portioner;v=['','stk','fed','dåse','dåser'].includes(i.enhed)?Math.max(.5,Math.round(v*2)/2):Math.round(v*10)/10;return{...i,maengde:v}}
function visOpskrift(oid,p){
  const o=D.opskrifter.find(x=>x.id===oid);if(!o)return;
  p=p||o.portioner||4;visPort=p;const niv=(window._niv||{})[o.id]||0,vr=variant(o.ing.map(i=>skal(i,o,p)),niv),ing=vr.ing,mt=match(o);
  const dage=[...Array(7)].map((_,k)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+k);return d});
  dlgin.innerHTML=`${o.foto?`<div class="dfoto" style="background-image:url(${o.foto})"></div>`:''}<h2>${esc(o.navn)}</h2>
  <div>${o.tid?`<span class="tag">⏱️ ${o.tid} min</span>`:''}${(o.tags||[]).map(x=>`<span class="tag">${x}</span>`).join('')}${D.lager.length?`<span class="tag">🥫 Du har ${mt.har}/${mt.af}</span>`:''}</div>
  ${o.portioner?`<div class="port" style="margin-top:12px"><button class="l" onclick="visOpskrift('${o.id}',${Math.max(1,p-1)})">−</button><input type="number" min="1" max="50" inputmode="numeric" value="${p}" style="width:76px;text-align:center;font-weight:800" onchange="visOpskrift('${o.id}',Math.max(1,Math.min(50,parseInt(this.value)||1)))"><b>personer</b><button class="l" onclick="visOpskrift('${o.id}',${p+1})">+</button></div>`:''}
  ${prisNivKort(o,niv,vr)}
  ${(()=>{const har=ing.filter(i=>iLager(i.navn)),mangler=ing.filter(i=>!iLager(i.navn)),pr=prisOverslag(mangler.length?mangler:ing,p);
   return `<div class="infobar"><span>⏱️ <b>${o.tid?o.tid+' min':'–'}</b><br><small>tid</small></span><span>👥 <b>${p}</b><br><small>personer</small></span><span>💰 <b>${pr.sum?'ca. '+kr(pr.sum):'?'}</b><br><small>${pr.sum?'at købe':'ingen priser endnu'}</small></span></div>
   ${pr.sum?`<p class="muted" style="font-size:13px;margin:4px 0 0">Det er ca. prisen for ${pr.n} af de ${pr.af} varer, du skal købe – hele pakker, ud fra de priser, du selv har skrevet. Du får rester med hjem til næste gang.</p>`:`<p class="muted" style="font-size:13px;margin:4px 0 0">Skriv priser på dine indkøb, så regner appen prisen ud her. Jeg gætter aldrig priser.</p>`}
   ${mangler.length?`<h3>🛒 Du mangler (${mangler.length})</h3><ul class="ingl">${mangler.map(i=>`<li>▫️ ${esc(ingTekst(i))} <a class="tilbud" href="https://etilbudsavis.dk/soeg/${encodeURIComponent(i.navn)}" target="_blank" rel="noopener">tilbud ↗</a></li>`).join('')}</ul>`:''}
   ${har.length?`<h3>✅ Du har på lager (${har.length})</h3><ul class="ingl">${har.map(i=>`<li>✅ ${esc(ingTekst(i))}</li>`).join('')}</ul>`:''}`})()}
  ${o.trin&&o.trin.length?`<h3>Sådan gør du</h3><ol class="trin">${o.trin.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:o.frem?`<h3>Sådan gør du</h3><div style="white-space:pre-wrap">${esc(o.frem)}</div>`:''}
  <div class="row" style="margin-top:16px"><button class="b" onclick="opskriftTilIndkob('${o.id}')">🛒 Læg det, jeg mangler, i indkøbslisten</button><button class="b" onclick="document.getElementById('vdag').hidden=false">📅 På madplan</button><button class="b" onclick="lavRet('${o.id}')">👩‍🍳 Jeg har lavet den (træk fra lager)</button></div>
  <div id="vdag" hidden><p class="muted" style="margin:10px 0 6px">Hvilken dag?</p><div class="chips">${dage.map(d=>`<button class="chip" onclick="setPlan('${iso(d)}','opskrift','${o.id}');dlg.close();toast('${esc(o.navn)} er sat på ${d.toLocaleDateString('da-DK',{weekday:'long'})}')">${d.toLocaleDateString('da-DK',{weekday:'short',day:'numeric'})}</button>`).join('')}</div></div>
  <div class="row" style="margin-top:10px"><button class="l" id="laesknap" onclick="laesOp('${o.id}')">🔊 Læs op</button><button class="l" onclick="del('opskrift:${o.id}')">📤 Del</button><button class="l" onclick="sletOpskrift('${o.id}')">Slet</button><button class="l" onclick="dlg.close()">Luk</button></div>

function lavRet(oid){
  const o=D.opskrifter.find(x=>x.id===oid);if(!o)return;const s=snap();let n=0;
  variant(o.ing.map(i=>skal(i,o,visPort||o.portioner)),(window._niv||{})[o.id]||0).ing.forEach(i=>{const l=iLager(i.navn);if(!l||l.basis)return;n++;
    if(l.maengde==null){D.lager=D.lager.filter(x=>x!==l);return}if(i.maengde==null)return;const a=base(l),b=base(i);if(a.k!==b.k)return;const rest=(a.v-b.v)/(ENH[l.enhed]?ENH[l.enhed][1]:1);if(rest<=0.0001)D.lager=D.lager.filter(x=>x!==l);else l.maengde=Math.round(rest*100)/100});
  save();dlg.close();vis();toast(n?'Velbekomme! '+n+' varer er trukket fra lageret 😋':'Velbekomme! 😋',n?fortrydTil(s):null);
}
function redigerOpskrift(oid,forslag){
  const o=D.opskrifter.find(x=>x.id===oid)||forslag||{navn:'',portioner:'',ing:[],frem:''};
  dlgin.innerHTML=`<h2>${oid?'Ret opskrift':'Ny opskrift'}</h2>
  <label>Navn</label><input id="onavn" style="width:100%" value="${esc(o.navn)}">
  <div class="row" style="flex-wrap:nowrap"><div><label>Portioner</label><input id="oport" type="number" min="1" style="width:100px" value="${o.portioner||''}"></div><div><label>Tid (min)</label><input id="otid" type="number" min="1" style="width:100px" value="${o.tid||''}"></div></div>
  <label>Ingredienser (én pr. linje, fx »200 g mel«)</label><textarea id="oing">${esc(o.ing.map(ingTekst).join('\n'))}</textarea>
  <label>Sådan gør du (ét trin pr. linje)</label><textarea id="ofrem" style="min-height:140px">${esc(o.trin?o.trin.join('\n'):o.frem)}</textarea>
  <div class="row" style="margin-top:14px"><button class="b" onclick="gemOpskrift('${oid||''}')">Gem</button><button class="l" onclick="dlg.close()">Annullér</button></div>`;
  if(!dlg.open)dlg.showModal();
}
function gemOpskrift(oid){
  const navn=document.getElementById('onavn').value.trim();if(!navn){alert('Skriv et navn');return}
  const gl=D.opskrifter.find(x=>x.id===oid)||{},frem=document.getElementById('ofrem').value.trim();
  const o={...gl,id:oid||id(),navn,portioner:parseInt(document.getElementById('oport').value)||null,
    ing:document.getElementById('oing').value.split('\n').filter(l=>l.trim()).map(parseIng),frem:'',tid:parseInt(document.getElementById('otid').value)||gl.tid||null};
  o.trin=frem.split('\n').map(s=>s.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean);
  if(!oid){o.kat=o.kat||'Mine opskrifter';o.tags=o.tags||[]}
  if(erStd(o.id))o.rettet=true;
  const i=D.opskrifter.findIndex(x=>x.id===oid);if(i>=0)D.opskrifter[i]=o;else D.opskrifter.push(o);

function forstaa(t){

  let tekst=(m?t.replace(m[0],' '):t).replace(ORD('kroner|kr\\.?|jeg|har|fik|betalt|betalte|brugt|brugte|til|på|for|i|om|måneden|hver','g'),' ').replace(/\s+/g,' ').trim();
  const type=ORD_IND.test(t)?'ind':ORD_FAST.test(t)?'fast':'kob';
  if(!tekst)tekst=type==='ind'?'Løn':type==='fast'?'Fast udgift':'Køb';

function laesKvittering(tekst){
  const linjer=tekst.split('\n').map(l=>l.trim()).filter(Boolean);
  const pris=l=>{const m=[...l.matchAll(/(\d{1,3}(?:[.\s]\d{3})*|\d+)[,.](\d{2})\b/g)];return m.length?parseFloat(m[m.length-1][1].replace(/[.\s]/g,'')+'.'+m[m.length-1][2]):null};
  let belob=null;
  for(const l of linjer){if(/(total|i alt|ialt|at betale|til betaling|beløb|sum)/i.test(l)&&pris(l)!=null)belob=pris(l)}
  const butik=(linjer.find(l=>/[a-zæøå]{3,}/i.test(l))||'Køb').replace(/[^\wæøåÆØÅ&\- ]/g,'').trim().slice(0,30);
  const dm=tekst.match(/\b(\d{1,2})[.\-/](\d{1,2})[.\-/](20\d{2}|\d{2})\b/);
  let dato=null;if(dm){const y=dm[3].length===2?'20'+dm[3]:dm[3];dato=y+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0')}

}

async function scanStregkode(maal){window._scanMaal=maal||'lager';

async function slaaOp(kode){

}

async function kvitteringTilLager(inp){
  const fl=inp.files[0];if(!fl)return;const st=document.getElementById('lstatus');st.textContent='Læser kvitteringen… (første gang tager det lidt længere)';
  try{
    await hentTesseract();
    const r=await Tesseract.recognize(fl,'dan',{logger:m=>{if(m.status==='recognizing text')st.textContent='Læser kvitteringen… '+Math.round(m.progress*100)+' %'}});
    const linjer=r.data.text.split('\n').map(l=>l.trim()).filter(Boolean);
    const varer=[];for(const l of linjer){if(/(total|i alt|ialt|at betale|moms|kort|byttepenge|rabat|dankort|visa|mastercard|kvittering|cvr|tlf|bon|subtotal)/i.test(l))continue;
      const m=l.match(/^(.*?[a-zæøå]{2,}.*?)\s+(-?\d{1,4}[,.]\d{2})\s*$/i);if(m){const navn=m[1].replace(/[^a-zæøå0-9 %\-]/gi,' ').replace(/\s+/g,' ').trim();if(navn.length>=2)varer.push({navn:navn.charAt(0).toUpperCase()+navn.slice(1).toLowerCase(),pris:parseFloat(m[2].replace(',','.'))})}}
    st.textContent='';
    if(!varer.length){toast('Jeg kunne ikke finde varer på billedet. Prøv et skarpere billede.');return}
    dlgin.innerHTML=`<h2>🧾 Varer fra kvitteringen</h2><p class="muted" style="margin-top:-6px">Fjern fluebenet ved det, der ikke skal på lager. Du kan rette navnene.</p>
    <ul class="ingl">${varer.map((v,i)=>`<li class="row" style="flex-wrap:nowrap"><input type="checkbox" checked id="kv${i}" style="width:22px;height:22px"><input id="kn${i}" value="${esc(v.navn)}" style="flex:1"><span class="muted">${kr(v.pris)}</span></li>`).join('')}</ul>
    <div class="row" style="margin-top:12px"><button class="b" style="flex:1" id="kvok">🥫 Læg på lager</button><button class="l" onclick="dlg.close()">Annullér</button></div>`;
    dlg.showModal();
    document.getElementById('kvok').onclick=()=>{const s=snap();let n=0;varer.forEach((v,i)=>{if(!document.getElementById('kv'+i).checked)return;const navn=document.getElementById('kn'+i).value.trim();if(!navn)return;D.lager.push({id:id(),navn,maengde:null,enhed:'',udlob:''});if(v.pris>0)D.priser[norm(navn)]=v.pris;n++});save();dlg.close();vis();toast(n+' varer lagt på lager 🥫',fortrydTil(s))};
  }catch(e){st.textContent=e.message==='net'?'Kræver internet første gang.':'Billedet kunne ikke læses. Prøv et skarpere billede.'}
}

function retPris(o,p){ // ud fra egne priser – hele pakker af det, man mangler
  const gange=Math.max(1,Math.ceil(p/(o.portioner||4)));let sum=0,ukendt=0,mangler=0;
  o.ing.forEach(i=>{const n=norm(i.navn);if(BASIS.includes(n))return;if(iLager(i.navn))return;mangler++;const pr=D.priser[n];if(pr)sum+=pr*gange;else ukendt++});
  return{sum:Math.round(sum),ukendt,mangler};
}

async function fotoOpskrift(inp){
  const fl=inp.files[0];if(!fl)return;const st=document.getElementById('ostatus');st.textContent='Læser opskriften… (første gang tager det lidt længere)';
  try{
    await hentTesseract();
    const r=await Tesseract.recognize(fl,'dan',{logger:m=>{if(m.status==='recognizing text')st.textContent='Læser opskriften… '+Math.round(m.progress*100)+' %'}});
    const linjer=r.data.text.split('\n').map(l=>l.replace(/[|_]/g,'').trim()).filter(l=>l.length>1);
    if(!linjer.length){st.textContent='Jeg kunne ikke læse noget. Prøv et skarpere billede.';return}
    const navn=linjer[0].replace(/^[^A-Za-zÆØÅæøå]+/,'');let ing=[],trin=[],portioner=null,tid=null;
    for(const l of linjer.slice(1)){
      const pm=l.match(/(\d+)\s*(pers|portion)/i);if(pm&&!portioner){portioner=+pm[1];continue}
      const tm=l.match(/(\d+)\s*min/i);if(tm&&!tid&&l.length<30){tid=+tm[1];continue}
      if(/^(ingredienser|fremgangsmåde|sådan gør du|tilberedning)/i.test(l))continue;
      const p=parseIng(l);if(p.maengde!=null&&l.length<45)ing.push(p);else trin.push(l.replace(/^\d+[.)]\s*/,''));
    }
    // saml korte, afbrudte linjer til hele sætninger
    const samlet=[];trin.forEach(x=>{if(samlet.length&&!/[.!?]$/.test(samlet[samlet.length-1]))samlet[samlet.length-1]+=' '+x;else samlet.push(x)});
    st.textContent='Tjek og ret teksten, før du gemmer.';
    redigerOpskrift('',{navn,portioner,tid,ing,trin:samlet,frem:''});
  }catch(e){st.textContent=e.message==='net'?'Kræver internet første gang.':'Billedet kunne ikke læses. Prøv et skarpere billede.'}
}

function variant(ing,niv){
  ing=ing.map(i=>({...i}));const aendr=[];if(!niv)return{ing,aendr,max:{ned:muligeRegler(ing,BILLIGERE).length,op:muligeRegler(ing,FINERE).length}};
  const regler=muligeRegler(ing,niv<0?BILLIGERE:FINERE).slice(0,Math.abs(niv));
  for(const r of regler){
    if(r.kod){const k=ing.find(i=>/hakket|kød/.test(norm(i.navn))&&i.maengde&&i.enhed==='g');if(k){const halv=Math.round(k.maengde/2);k.maengde=halv;ing.push({navn:'røde linser',maengde:Math.round(halv/2),enhed:'g'});aendr.push(r.tekst)}continue}

  return{ing,aendr,max:{ned:muligeRegler(ing,BILLIGERE).length,op:muligeRegler(ing,FINERE).length}};
}

const ALTID=['salt','peber','vand','olie','rapsolie','olivenolie','sukker','smør'];
function harMatch(o,har){
  const tokHar=har.map(tok);const findes=n=>{const w=tok(n);if(!w.length)return false;return tokHar.some(a=>a.length&&(a.every(x=>w.includes(x))||w.every(x=>a.includes(x))))};
  const ing=o.ing.filter(i=>!ALTID.includes(norm(i.navn)));const mangler=ing.filter(i=>!findes(i.navn));

}

function naesteLoen(md){

// Gratis: TensorFlow COCO-SSD kører i browseren + tekst på pakker (Tesseract). Ingen nøgle, intet sendes væk.
const COCO_DA={banana:'Bananer',apple:'Æbler',orange:'Appelsiner',broccoli:'Broccoli',carrot:'Gulerødder','hot dog':'Pølser',pizza:'Pizza',donut:'Donuts',cake:'Kage',sandwich:'Sandwich',bottle:'Flaske (fx mælk/juice)',cup:'Kop/bæger (fx yoghurt)',bowl:'Skål med rester'};
function hentScript(src){return new Promise((ok,fejl)=>{if(document.querySelector('script[src="'+src+'"]'))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fejl(new Error('net'));document.head.appendChild(s)})}
let cocoModel=null;
async function hentCoco(){if(cocoModel)return cocoModel;await hentScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');await hentScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');cocoModel=await cocoSsd.load({base:'mobilenet_v2'});return cocoModel}
function kendteVareord(){const s=new Set();D.opskrifter.forEach(o=>o.ing.forEach(i=>tok(i.navn).forEach(w=>{if(w.length>=4&&!/^(spsk|dåse|dåser|pakke|bundt|frisk|stk)$/.test(w))s.add(w)})));['mælk','skyr','yoghurt','smør','ost','æg','juice','fløde','pålæg','skinke','leverpostej','rugbrød','toast','pasta','ris','havregryn','kyllingebryst','hakket','bacon','pølser','agurk','tomat','tomater','peberfrugt','salat','løg','kartofler','creme','fraiche','remoulade','ketchup','sennep','mayonnaise'].forEach(w=>s.add(w));return s}
async function koeleskabFoto(inp){
  const fl=inp.files[0];if(!fl)return;const st=document.getElementById('lstatus');st.textContent='Ser på billedet… (første gang skal appen hente genkendelsen – det kan tage lidt tid)';
  const img=new Image();img.src=URL.createObjectURL(fl);await new Promise(r=>img.onload=r);
  const fund=new Map();let fejl='';
  try{const mdl=await hentCoco();const res=await mdl.detect(img,30,.35);res.forEach(p=>{const da=COCO_DA[p.class];if(da)fund.set(da,(fund.get(da)||0)+1)})}catch(e){fejl='billede'}
  try{st.textContent='Læser tekst på pakkerne…';await hentTesseract();const r=await Tesseract.recognize(fl,'dan');const ord=kendteVareord();
    const set=new Set();r.data.text.toLowerCase().replace(/[^a-zæøå\s]/g,' ').split(/\s+/).forEach(w=>{if(w.length>=3&&ord.has(w))set.add(w)});
    set.forEach(w=>{const navn=w.charAt(0).toUpperCase()+w.slice(1);if(![...fund.keys()].some(k=>norm(k).includes(w)))fund.set(navn,1)})}catch(e){if(!fejl)fejl='tekst'}
  URL.revokeObjectURL(img.src);st.textContent='';
  const liste=[...fund.entries()];
  dlgin.innerHTML=`<h2>🧊 Det kunne jeg se</h2><p class="muted" style="margin-top:-6px">${liste.length?'Tjek listen. Fjern fluebenet ved det forkerte, og skriv det, jeg ikke fandt.':'Jeg kunne ikke genkende noget på billedet.'}</p>
  <ul class="ingl" id="kslist">${liste.map(([n,a],i)=>`<li class="row" style="flex-wrap:nowrap"><input type="checkbox" checked id="ks${i}" style="width:22px;height:22px"><input id="kn${i}" value="${esc(a>1?a+' '+n:n)}" style="flex:1"></li>`).join('')}</ul>
  <label>Mangler der noget? (komma mellem varerne)</label><textarea id="ksekstra" style="min-height:60px" placeholder="Fx mælk, æg, smør"></textarea>
  <p class="muted" style="font-size:13px">Appen kan kun genkende nogle få ting på billeder (fx frugt, gulerødder, broccoli, flasker) og læse tekst på pakker. Resten skriver du selv. Billedet sendes ikke nogen steder hen.</p>
  <div class="row" style="margin-top:10px"><button class="b" style="flex:1" onclick="gemKoeleskab(${liste.length})">🥫 Læg på lager</button><button class="l" onclick="dlg.close()">Annullér</button></div>`;
  dlg.showModal();
  if(fejl==='billede'&&!liste.length)toast('Billedgenkendelsen kræver internet første gang');
}
function gemKoeleskab(n){
  const s=snap();let k=0;const navne=[];

  <div class="row"><button class="b" style="flex:1" onclick="localStorage.setItem(KEY+'-guide','set');dlg.close()">OK</button><button class="l" onclick="localStorage.setItem(KEY+'-guide','senere');dlg.close()">Senere</button></div>`;
  if(!dlg.open)dlg.showModal();
}
if(erMobil&&!erInstalleret){
  document.getElementById('instknap').style.display='';
  if(!localStorage.getItem(KEY+'-guide'))setTimeout(visGuide,800);
}

// ---------- Sikre opdateringer (version 8) ----------
document.getElementById('ver').textContent='version '+APP_VERSION;
if(localStorage.getItem(KEY+'-fejl')){localStorage.removeItem(KEY+'-fejl');setTimeout(()=>toast('Den nye opdatering havde en fejl. Du kører videre på den gamle version – intet er tabt.'),600)}
function visOpdatering(w){
  if(document.getElementById('opd'))return;
  if(Date.now()<+(localStorage.getItem(KEY+'-vent')||0))return;
  fetch('version.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({})).then(v=>{
    const d=document.createElement('div');d.className='opd';d.id='opd';
    d.innerHTML=`<b style="font-size:18px">✨ Ny opdatering${v.version?' – version '+v.version:''}</b>${v.nyt?`<p style="margin:6px 0">${esc(v.nyt)}</p>`:''}<p class="muted" style="margin:4px 0 10px">Du bestemmer selv. Appen virker fint på den version, du har nu.</p><div class="row"><button class="b" style="flex:1" id="opdja">Opdater nu</button><button class="l" id="opdvent">Vent med at opdatere</button></div>`;
    document.body.appendChild(d);
    document.getElementById('opdja').onclick=()=>{localStorage.setItem(KEY+'-test',Date.now());d.innerHTML='<b>Opdaterer…</b>';w.postMessage('OPDATER')};
    document.getElementById('opdvent').onclick=()=>{localStorage.setItem(KEY+'-vent',Date.now()+864e5);d.remove();toast('OK – jeg spørger igen i morgen')};
  });
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  let genstart=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(localStorage.getItem(KEY+'-test')&&!genstart){genstart=true;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const tjek=()=>{if(reg.waiting&&navigator.serviceWorker.controller)visOpdatering(reg.waiting)};
    tjek();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed')tjek()})});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
  });
}

// ---------- Del med en ven (uden server) ----------
function delLink(type,data){return location.origin+location.pathname+'#del='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({type,data,fra:'Budget og Mad'})))))}
async function del(type){
  let data,titel;
  if(type==='indkob'){data=D.indkob.filter(x=>!x.kobt).map(x=>({navn:x.navn,maengde:x.maengde,enhed:x.enhed}));titel='min indkøbsliste';if(!data.length){toast('Listen er tom');return}}
  else if(type==='madplan'){data={};for(let i=0;i<7;i++){const d=new Date(ugeStart);d.setDate(d.getDate()+i);const v=D.madplan[iso(d)];if(v){const o=v.opskrift&&D.opskrifter.find(x=>x.id===v.opskrift);data[iso(d)]=o?{navn:o.navn,opskrift:o}:{tekst:v.tekst}}}titel='ugens madplan';if(!Object.keys(data).length){toast('Madplanen er tom');return}}
  else if(type.startsWith('opskrift:')){const o=D.opskrifter.find(x=>x.id===type.slice(9));data=o;type='opskrift';titel='opskriften på '+o.navn}
  const url=delLink(type,data),tekst='Her er '+titel+' fra Budget og Mad 🍲';
  if(navigator.share){try{await navigator.share({title:'Budget og Mad',text:tekst,url});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(tekst+'\n'+url);toast('Linket er kopieret – send det til din ven')}catch(e){prompt('Kopiér linket og send det:',url)}
}
function modtagDel(){
  if(!location.hash.startsWith('#del='))return;
  let p;try{p=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(5))))))}catch(e){return}
  history.replaceState(null,'',location.pathname);
  const navn={indkob:'en indkøbsliste',madplan:'en madplan',opskrift:'en opskrift'}[p.type];if(!navn)return;
  dlgin.innerHTML=`<h2>📥 Du har fået ${navn}</h2><p class="muted">Kun det, din ven har valgt at dele, er med. Intet andet fra din ven kommer ind i din app.</p>
  ${p.type==='indkob'?`<ul class="ingl">${p.data.map(x=>`<li>${esc(ingTekst(x))}</li>`).join('')}</ul>`:p.type==='madplan'?`<ul class="ingl">${Object.entries(p.data).map(([k,v])=>`<li>${new Date(k).toLocaleDateString('da-DK',{weekday:'long'})}: ${esc(v.navn||v.tekst)}</li>`).join('')}</ul>`:`<p><b>${esc(p.data.navn)}</b></p>`}
  <div class="row" style="margin-top:12px"><button class="b" id="tagimod" style="flex:1">Tilføj til min app</button><button class="l" onclick="dlg.close()">Nej tak</button></div>`;
  dlg.showModal();
  document.getElementById('tagimod').onclick=()=>{const s=snap();
    if(p.type==='indkob')p.data.forEach(x=>D.indkob.push({id:id(),navn:String(x.navn),maengde:x.maengde??null,enhed:String(x.enhed||''),pris:D.priser[norm(x.navn)]??null,kobt:false}));
    if(p.type==='opskrift'||p.type==='madplan'){const tilf=o=>{let e=D.opskrifter.find(x=>x.navn===o.navn);if(!e){e={id:id(),navn:String(o.navn),portioner:o.portioner||null,ing:(o.ing||[]).map(i=>({navn:String(i.navn),maengde:i.maengde??null,enhed:String(i.enhed||'')})),trin:Array.isArray(o.trin)?o.trin.map(String):undefined,frem:String(o.frem||''),tags:Array.isArray(o.tags)?o.tags.map(String):[],tid:+o.tid||null,foto:/^fotos\/retter\/[a-z]+\.jpg$/.test(o.foto||'')?o.foto:''};D.opskrifter.push(e)}return e};
      if(p.type==='opskrift')tilf(p.data);else Object.entries(p.data).forEach(([k,v])=>{if(!/^\d{4}-\d\d-\d\d$/.test(k))return;D.madplan[k]=v.opskrift?{opskrift:tilf(v.opskrift).id}:{tekst:String(v.tekst||'')}})}
    save();dlg.close();gaaTil(p.type==='indkob'?'indkob':p.type==='madplan'?'madplan':'opskrifter');toast('Tilføjet ✔',fortrydTil(s))};
}
modtagDel();
modtagSvar();

// ---------- Skriv til hjælperen ----------
let hjaelpFiler=[];
async function sendHjaelp(){
  const tekst=document.getElementById('hjtekst').value.trim();if(!tekst&&!hjaelpFiler.length){alert('Skriv hvad du har brug for hjælp til');return}
  const msg='Hej '+EJER+'! Jeg har brug for hjælp med Budget og Mad (version '+APP_VERSION+'):\n\n'+tekst;
  if(navigator.share){const d={title:'Hjælp til Budget og Mad',text:msg};if(hjaelpFiler.length&&navigator.canShare&&navigator.canShare({files:hjaelpFiler}))d.files=hjaelpFiler;try{await navigator.share(d);dlg.close();return}catch(e){if(e.name==='AbortError')return}}
  location.href='mailto:?subject='+encodeURIComponent('Hjælp til Budget og Mad')+'&body='+encodeURIComponent(msg+(hjaelpFiler.length?'\n\n(Husk at vedhæfte dine billeder)':''));
}
function visHjaelp(){
  hjaelpFiler=[];
  dlgin.innerHTML=`<h2>💬 Brug for hjælp?</h2><p class="muted" style="margin-top:-6px">Skriv til ${esc(EJER)}. Du kan sætte billeder på, som du selv har taget, fx skærmbilleder.</p>
  <textarea id="hjtekst" placeholder="Hvad driller?" style="min-height:90px"></textarea>
  <label class="l" style="display:block;text-align:center;margin:10px 0 0;cursor:pointer;color:inherit;background:var(--felt);border-radius:14px;padding:12px;font-weight:700">🖼️ Vælg billeder<input type="file" accept="image/*" multiple hidden onchange="hjaelpFiler=[...this.files];document.getElementById('hjfil').innerHTML=hjaelpFiler.map(f=>'✔ '+esc(f.name)).join('<br>')"></label>
  <div id="hjfil" class="muted" style="margin-top:6px"></div>
  <div class="row" style="margin-top:12px"><button class="b" style="flex:1" onclick="sendHjaelp()">Send ➜</button><button class="l" onclick="dlg.close()">Luk</button></div>
  <p class="muted" style="font-size:13px">Det er kun det, du selv skriver og vælger, der bliver sendt. Appen sender aldrig noget af sig selv.</p>
  <div style="background:var(--felt);border-radius:14px;padding:12px;margin-top:10px"><b>ℹ️ Om appen</b><p class="muted" style="margin:6px 0 0;font-size:14px">Budget og Mad – version ${APP_VERSION}. © ${esc(EJER)}. Appen tilhører ${esc(EJER)}, og kun ${esc(EJER)} kan sende opdateringer. Den må ikke kopieres eller deles videre uden tilladelse. Dine tal ligger kun på din egen telefon. Fotos fra Unsplash. Varedata fra Open Food Facts.</p></div>`;
  if(!dlg.open)dlg.showModal();
}
function hjaelpKort(){return dataKort()+`<button class="hjknap" onclick="visHjaelp()"><span>💬</span><b>Brug for hjælp?</b><small>Skriv til ${esc(EJER)}</small></button>`}
